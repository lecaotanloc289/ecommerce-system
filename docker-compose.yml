services:
  postgres:
    image: postgres:16-alpine
    container_name: ecom-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecom-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage. Docker Hub's minio/minio is no longer pullable, so local dev
  # uses RustFS (Apache-2.0; S3 API on 9000, web console on 9001). Prod uses Cloudflare R2.
  s3:
    image: rustfs/rustfs:latest
    container_name: ecom-s3
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - s3_data:/data
    user: root

  # One-shot: creates buckets `kyc` (private) and `media` (public read). Idempotent.
  s3-init:
    image: amazon/aws-cli:latest
    container_name: ecom-s3-init
    depends_on:
      - s3
    restart: 'no'
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./docker/s3-init.sh:/s3-init.sh:ro
    entrypoint: ['sh', '/s3-init.sh']

  mailhog:
    image: mailhog/mailhog:latest
    container_name: ecom-mailhog
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres_data:
  redis_data:
  s3_data:
