name: E2E

# Slow (builds both frontends, boots API + worker, drives a real browser), so it does not run on
# every push: only for PRs into `prod` and on demand. See e2e/CLAUDE.md.
on:
  pull_request:
    branches: [prod]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: playwright smoke flows
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # `pnpm e2e` creates its own throwaway database on this server and uses Redis DB 13.
      E2E_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      E2E_REDIS_URL: redis://localhost:6379/13
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Install Playwright browser
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      # Builds the API, worker and (for the e2e ports) both frontends, boots the stack, runs the flows.
      - name: Run e2e
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
