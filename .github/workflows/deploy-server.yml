name: Deploy server → Fly.io

on:
  push:
    branches: [dev, prod]
    paths:
      - 'server/**'
      - 'packages/core/**'
      - 'packages/db/**'
      - 'packages/payments/**'
      - 'packages/i18n/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-server.yml'

concurrency:
  group: deploy-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: flyctl deploy
    runs-on: ubuntu-latest
    env:
      FLY_APP: elma-api-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # Build context = repo root so the Dockerfile can copy pnpm workspace files.
        run: flyctl deploy --remote-only --app "$FLY_APP" --config server/fly.toml --dockerfile server/Dockerfile .

      - name: Smoke check
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "https://$FLY_APP.fly.dev/v1/health" || true)
            echo "attempt $i → HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 6
          done
          echo "Health check never returned 200"
          exit 1
