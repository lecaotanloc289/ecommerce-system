name: Deploy web → Cloudflare Pages

on:
  push:
    branches: [dev, prod]
    paths:
      - 'apps/client/**'
      - 'packages/ui/**'
      - 'packages/core/**'
      - 'packages/i18n/**'
      - 'packages/sdk/**'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - '.github/workflows/deploy-web.yml'

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: build + wrangler pages deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      NEXT_PUBLIC_API_URL: https://elma-api-${{ github.ref_name }}.fly.dev
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (Next.js static export → apps/client/out)
        run: pnpm --filter @apps/web build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/client/out --project-name=elma-web --branch=${{ github.ref_name }}
